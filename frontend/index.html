<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DojoSys</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div class="botoesTab">
            <button class="botaoTab active" content-id="matricular">Matricular</button>
            <button class="botaoTab" content-id="listar">Listar</button>
            <button class="botaoTab" content-id="atualizar">Atualizar</button>
            <button class="botaoTab" content-id="apagar">Apagar</button>
        </div>

        <div class="label">
            
            <!-- MATRICULAR -->
            <div class="conteudo show" id="matricular">
                <h1 class="titulo-label">Matricular Aluno</h1>

                <div class="matricular-label">
                    <div class="form-group">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" placeholder="Digite o nome">
                    </div>

                    <div class="form-group">
                        <label for="idade">Idade:</label>
                        <input type="number" id="idade" placeholder="Digite a idade">
                    </div>

                    <div class="form-group">
                        <label for="peso">Peso:</label>
                        <input type="number" id="peso" placeholder="Digite o peso" step="0.3">
                    </div>
                            
                    <div class="form-group">
                        <label for="faixa">Cor da faixa:</label>
                        <select id="faixa" name="faixas">
                            <option value="1">1 - Branca</option>
                            <option value="2">2 - Cinza</option>
                            <option value="3">3 - Azul</option>
                            <option value="4">4 - Amarelo</option>
                            <option value="5">5 - Laranja</option>
                            <option value="6">6 - Verde</option>
                            <option value="7">7 - Roxa</option>
                            <option value="8">8 - Marrom</option>
                            <option value="9">9 - Preta</option>
                        </select>
                    </div>

                    <button class="botao linha-cheia" onclick="criarJudoca()">
                        Matricular Judoca
                    </button>
                </div>
            </div>

            <!-- LISTAR -->
            <div class="conteudo" id="listar">
                <h1 class="titulo-label">Listar Alunos</h1>
                <div class="listar-label">
                    <input type="number" id="inputBuscarId" placeholder="Digite o ID">
                    <button class="botao" onclick="buscarPorId()">Buscar por ID</button>
                    <button class="botao" onclick="buscarJudocas()">Buscar Judocas</button>
                    <ul id="listaHTML"></ul>
                </div>
            </div>

            <!-- ATUALIZAR -->
            <div class="conteudo" id="atualizar">
                <h1 class="titulo-label">Atualizar Aluno</h1>

                <div class="atualizar-label">
                    <div class="form-group linha-cheia">
                        <label for="idUpdatePorId">ID:</label>
                        <input type="text" id="idUpdatePorId" placeholder="Digite o ID">
                    </div>

                    <div class="form-group">
                        <label for="nomeUpdate">Nome:</label>
                        <input type="text" id="nomeUpdate" placeholder="Digite o novo nome">
                    </div>

                    <div class="form-group">
                        <label for="idadeUpdate">Idade:</label>
                        <input type="number" id="idadeUpdate" placeholder="Digite a nova idade">
                    </div>

                    <div class="form-group">
                        <label for="pesoUpdate">Peso:</label>
                        <input type="number" id="pesoUpdate" placeholder="Digite o novo peso" step="0.3">
                    </div>
                    
                    <div class="form-group">
                        <label for="faixaUpdate">Cor da faixa:</label>
                        <select id="faixaUpdate" name="faixas">
                            <option value="1">1 - Branca</option>
                            <option value="2">2 - Cinza</option>
                            <option value="3">3 - Azul</option>
                            <option value="4">4 - Amarelo</option>
                            <option value="5">5 - Laranja</option>
                            <option value="6">6 - Verde</option>
                            <option value="7">7 - Roxa</option>
                            <option value="8">8 - Marrom</option>
                            <option value="9">9 - Preta</option>
                        </select>
                    </div>
                    
                    <button type="button" class="botao linha-cheia" onclick="atualizarPorId()">
                        Atualizar Judoca
                    </button>
                </div>
            </div>
            
            <!-- APAGAR -->
            <div class="conteudo" id="apagar">
                <h1 class="titulo-label">Apagar Aluno</h1>
                <div class="apagar-label">
                    <input type="number" id="inputDeletarPorId" placeholder="Digite o ID para excluir">
                    <button class="botao" onclick="deletarPorId()">Deletar</button>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
